name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the oldest version the code supports (X | None syntax)
      - name: Acceptance and invariant tests
        run: python -m unittest tests.test_ledger -v
      - name: Replay runs end to end
        run: python replay.py
      - name: Committed figures match the code
        run: |
          python tools/make_figures.py
          git status --porcelain -- docs/img
          test -z "$(git status --porcelain -- docs/img)"   # catches changed and never-committed figures
      - name: The deliberate failure still fails, for its documented reason
        run: |
          set +e
          python -m unittest tests.test_known_failure > known.log 2>&1
          status=$?
          set -e
          cat known.log
          if [ "$status" -eq 0 ]; then
            echo "tests/test_known_failure.py passed, but it must fail on purpose (see the test and REJECTED.md)"; exit 1
          fi
          grep -q "AssertionError: 0 != 10000" known.log || { echo "it failed, but not for its documented reason"; exit 1; }
