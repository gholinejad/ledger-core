<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 150' role='img' aria-label='Back-valuation gate with maker-checker' font-family='Inter, Helvetica, Arial, sans-serif'><defs><marker id='a3b4a66' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#3b4a66'/></marker><marker id='a1f5fbf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1f5fbf'/></marker><marker id='ab3261e' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#b3261e'/></marker><marker id='a2f7d4f' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f7d4f'/></marker><marker id='ab26a00' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#b26a00'/></marker><marker id='a8a94a6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a94a6'/></marker></defs><rect width='760' height='150' fill='#ffffff'/><rect x='8.0' y='14.0' width='150.0' height='58.0' rx='8' fill='#f4f6fa' stroke='#3b4a66' stroke-width='1.6'/><text x='18.0' y='38.0' font-size='12.5' fill='#3b4a66' font-weight='700' text-anchor='start'>entry arrives</text><text x='18.0' y='57.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='start'>value date vs business date</text><rect x='186.0' y='14.0' width='168.0' height='58.0' rx='8' fill='#e8f0fb' stroke='#1f5fbf' stroke-width='1.6'/><text x='196.0' y='38.0' font-size='12.5' fill='#1f5fbf' font-weight='700' text-anchor='start'>value date &lt; today?</text><text x='196.0' y='57.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='start'>system compensations exempt</text><rect x='382.0' y='14.0' width='160.0' height='58.0' rx='8' fill='#fdf3e2' stroke='#b26a00' stroke-width='1.6'/><text x='392.0' y='38.0' font-size='12.5' fill='#b26a00' font-weight='700' text-anchor='start'>reason code + checker</text><text x='392.0' y='57.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='start'>a second person approves</text><rect x='570.0' y='14.0' width='182.0' height='58.0' rx='8' fill='#fbe9e7' stroke='#b3261e' stroke-width='1.6'/><text x='580.0' y='38.0' font-size='12.5' fill='#b3261e' font-weight='700' text-anchor='start'>inside a sealed period?</text><text x='580.0' y='57.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='start'>yes: refuse, post today</text><line x1='158.0' y1='43.0' x2='184.0' y2='43.0' stroke='#3b4a66' stroke-width='1.6' marker-end='url(#a3b4a66)'/><line x1='354.0' y1='43.0' x2='380.0' y2='43.0' stroke='#3b4a66' stroke-width='1.6' marker-end='url(#a3b4a66)'/><text x='367.0' y='34.0' font-size='10' fill='#6b7890' font-weight='600' text-anchor='middle'>yes</text><line x1='542.0' y1='43.0' x2='568.0' y2='43.0' stroke='#3b4a66' stroke-width='1.6' marker-end='url(#a3b4a66)'/><rect x='382.0' y='98.0' width='370.0' height='44.0' rx='8' fill='#e7f3ec' stroke='#2f7d4f' stroke-width='1.4'/><text x='394.0' y='117.0' font-size='11' fill='#2f7d4f' font-weight='650' text-anchor='start'>every back-valued entry → daily report to Finance + Compliance</text><text x='394.0' y='133.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='start'>with its fee and interest impact per customer</text><line x1='462.0' y1='72.0' x2='462.0' y2='96.0' stroke='#2f7d4f' stroke-width='1.4' marker-end='url(#a2f7d4f)'/></svg>
