 y='168.0' font-size='10' fill='#b3261e' font-weight='600' text-anchor='start'>available &lt; 0</text><rect x='106.0' y='182.0' width='150.0' height='60.0' rx='10' fill='#fbe9e7' stroke='#b3261e' stroke-width='2'/><text x='181.0' y='210.0' font-size='13.5' fill='#b3261e' font-weight='800' text-anchor='middle'>DECLINED</text><text x='181.0' y='227.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='middle'>final; never re-approved</text><line x1='256.0' y1='118.0' x2='364.0' y2='118.0' stroke='#2f7d4f' stroke-width='1.8' marker-end='url(#a2f7d4f)'/><text x='310.0' y='108.0' font-size='10.5' fill='#2f7d4f' font-weight='700' text-anchor='middle'>matching</text><text x='310.0' y='136.0' font-size='10.5' fill='#2f7d4f' font-weight='700' text-anchor='middle'>settlement</text><rect x='366.0' y='84.0' width='150.0' height='68.0' rx='10' fill='#e7f3ec' stroke='#2f7d4f' stroke-width='2'/><text x='441.0' y='116.0' font-size='13.5' fill='#2f7d4f' font-weight='800' text-anchor='middle'>SETTLED</text><text x='441.0' y='133.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='middle'>hold released</text><rect x='366.0' y='6.0' width='150.0' height='56.0' rx='10' fill='#fff' stroke='#8a94a6' stroke-width='2' stroke-dasharray='6 4'/><text x='441.0' y='32.0' font-size='13.5' fill='#8a94a6' font-weight='800' text-anchor='middle'>EXPIRED</text><text x='441.0' y='49.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='middle'>needs a hold TTL</text><path d='M200 82 C 220 34, 280 32, 364 32' stroke='#8a94a6' stroke-width='1.5' fill='none' stroke-dasharray='6 4' marker-end='url(#a8a94a6)'/><rect x='560.0' y='6.0' width='192.0' height='56.0' rx='10' fill='#fff' stroke='#8a94a6' stroke-width='2' stroke-dasharray='6 4'/><text x='656.0' y='32.0' font-size='13.5' fill='#8a94a6' font-weight='800' text-anchor='middle'>VOIDED</text><text x='656.0' y='49.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='middle'>merchant / timeout reversal</text><path d='M256 100 C 400 76, 480 54, 558 38' stroke='#8a94a6' stroke-width='1.5' fill='none' stroke-dasharray='6 4' marker-end='url(#a8a94a6)'/><rect x='560.0' y='182.0' width='192.0' height='60.0' rx='10' fill='#fdf3e2' stroke='#b26a00' stroke-width='2'/><text x='656.0' y='210.0' font-size='13.5' fill='#b26a00' font-weight='800' text-anchor='middle'>FORCE_POST</text><text x='656.0' y='227.0' font-size='10.5' fill='#3b4a66' font-weight='400' text-anchor='middle'>post + EXCEPTION for review</text><path d='M540 150 C 580 160, 620 166, 650 180' stroke='#b26a00' stroke-width='1.6' fill='none' marker-end='url(#ab26a00)'/><text x='530.0' y='146.0' font-size='10.5' fill='#b26a00' font-weight='600' text-anchor='start'>settlement with no approved authorization</text><text x='560.0' y='100.0' font-size='10.5' fill='#6b7890' font-weight='600' text-anchor='start'>dashed = not modelled,</text><text x='560.0' y='115.0' font-size='10.5' fill='#6b7890' font-weight='600' text-anchor='start'>needed before production</text></svg>
